services:
  forum-service:
    build: .
    image: kupitmanilia/forum-service
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_NAME: java63
      MONGO_URI: mongodb://db:27017/java63
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      - db

  db:
    image: mongo:8.0.6
    volumes:
      - mongo_volume:/data/db

volumes:
  mongo_volume: